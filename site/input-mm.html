<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Man-Month &middot; UPMK IV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=__BUILD__">
<style>
.container > .card { padding:24px; }
[hidden]{display:none!important}
.in-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:16px; }
.in-grid label, .in-row label { display:block; font-size:12px; font-weight:600; margin-bottom:4px; }
.in-grid input, .in-row input, .in-row select { width:100%; padding:8px; border:1px solid var(--line, #d0d5dd); border-radius:6px; font:inherit; background:#fff; }
.in-row { display:grid; grid-template-columns:2fr 3fr 90px 36px; gap:8px; align-items:end; margin-bottom:8px; }
@media (max-width:720px){ .in-row { grid-template-columns:1fr 1fr; } }
.in-msg { margin-top:12px; padding:10px 12px; border-radius:6px; font-size:14px; }
.in-msg.ok { background:#e7f6ec; color:#14532d; } .in-msg.err { background:#fde8e8; color:#7f1d1d; }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="container">
      <section class="card">
        <h1>Input Man-Month Aktual</h1>
        <p class="muted">Isi realisasi MM per personil untuk satu bulan. Data masuk ke tab <strong>MM_Aktual</strong> di spreadsheet induk. Mengirim ulang bulan + nama + proyek yang sama akan <strong>menimpa</strong> nilai lama, bukan menggandakan.</p>
        <div id="in-warn" class="banner" hidden></div>
        <form id="in-form" autocomplete="off">
          <div class="in-grid">
            <div><label for="in-bulan">Bulan</label><input type="month" id="in-bulan" required></div>
            <div><label for="in-pin">PIN</label><input type="password" id="in-pin" required></div>
          </div>
          <div id="in-rows"></div>
          <div class="btn-row">
            <button type="button" class="btn" id="in-add">+ Tambah baris</button>
            <button type="submit" class="btn" id="in-send">Kirim</button>
          </div>
        </form>
        <div id="in-msg" class="in-msg" hidden></div>
      </section>
    </div>
  </main>
</div>
<script>
(function () {
  var v = Date.now();
  ['sidebar', 'config', 'sheets', 'data'].forEach(function (n) { document.write('<script src="js/' + n + '.js?t=' + v + '"><\/script>'); });
  document.write('<script src="js/input-mm.js?t=' + v + '"><\/script>');
})();
</script>
</body>
</html>
